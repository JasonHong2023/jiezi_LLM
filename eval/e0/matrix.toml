# E0 候選矩陣（add-e0-benchmark design D1；使用者 2026-11-15 同意）
# E0 candidate matrix (add-e0-benchmark design D1; approved by the user on 2026-11-15)
#
# model       = models/manifest.toml 的名稱 / manifest name
# group       = ternary | 1-bit | int8 | int4 | int2
# base        = 基底模型（同基底對照表用）/ base model (for the same-base table)
# quant       = 量化型別；TQ1_0 / TQ2_0 沒有 CUDA kernel / quant type; TQ1_0 / TQ2_0 have no CUDA kernels
# placement   = 預設擺放 gpu | cpu；實際擺放在載入前依預算決定（design D2）/ default; decided against budgets at load
# reference_run = 已有的執行，不重跑 / existing run, not rerun
# placement_check = 擺放對照列，不畫進帕累托圖 / placement-comparison row, not plotted
#
# 列的順序就是執行順序：小模型先跑，萬一中途卡住也先有結果。
# Row order is run order: small models first, so results exist even if a later row stalls.

