# 芥子（Jiezi）專案設定 / Jiezi project configuration
# hwprobe 與 bootstrap 只用標準函式庫（R9、R23）；執行期套件只有 gateway 用（add-gateway D2，R23 查證見 stack.md）
# hwprobe and bootstrap use the standard library only (R9, R23); runtime packages serve the gateway only
# (add-gateway D2; R23 check recorded in stack.md)
[project]
name = "jiezi"
version = "0.1.0"
description = "芥子納須彌 — tiny compressed core LLM plus system capabilities on laptop-class hardware"
readme = "openspec/project.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "lunar-python==1.4.9",
    "pillow==13.0.0",
    "pypdf==7.1.0",
    "starlette==1.10.0",
    "textual==8.2.8",
    "uvicorn==0.54.0",
]

# 建置工具以 uv 安裝到 .venv，不需要 sudo / Build tools installed into .venv by uv, no sudo needed
[dependency-groups]
dev = [
    "cmake==4.4.4",
    "meson==1.12.1",
    "ninja==1.13.2",
]
# Phase 6 訓練用（使用者 2026-11-17 同意安裝）；不在預設群組，一般使用不會下載 / training only, not installed by default
# 安裝：uv sync --group train
train = [
    "bitsandbytes==0.50.2",
    "flash-linear-attention==0.6.0",
    "peft==0.21.3",
    "torch==2.15.0",
    "transformers==5.23.0",
]
# 選用網頁讀取後端：web-fetch 首選；scrapling 回退（JS/stealth PoC）；兩者都不進預設安裝。
# Optional web-read backends: web-fetch is preferred, scrapling is fallback (JS/stealth PoC); neither is installed by default.
web-fetch = [
    "httpx==0.28.1",
]
scrapling = [
    "scrapling[ai,fetchers]==0.5.1",
    "anyio>=4.14.2",
    "mcp>=2.2.0",
]

[tool.uv]
default-groups = ["dev"]
package = false
